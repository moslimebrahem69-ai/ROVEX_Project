name: rovex
description: ROVEX — CNC tufting control (Flutter HMI) + C machine runtime
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  file_picker: ^8.1.2
  uuid: ^4.5.1
  ffi: ^2.1.3
  desktop_drop: ^0.5.0
  image: ^4.3.0
  cross_file: ^0.3.4
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/dar_icon_log.png
    - assets/audio/ambient_soft.wav
    - assets/designs/

flutter_launcher_icons:
  image_path: "assets/brand/dar_icon_log.png"
  windows:
    generate: true